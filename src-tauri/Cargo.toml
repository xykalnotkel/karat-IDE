[package]
name = "karat-desktop"
version = "0.4.0"
edition = "2021"
description = "Karat desktop and mobile shell, developed by XySpace"
license = "MIT"
authors = ["XySpace and Karat contributors"]
repository = "https://github.com/xykalnotkel/karat-IDE"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
karat = { path = ".." }
