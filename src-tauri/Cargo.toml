[package]
name = "karat-desktop"
version = "0.2.0"
edition = "2021"
description = "Karat desktop and mobile shell, developed by XySpace"
license = "MIT"
authors = ["XySpace and Karat contributors"]
repository = "https://github.com/xykalnotkel/karat-IDE"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync"] }
karat = { path = ".." }
