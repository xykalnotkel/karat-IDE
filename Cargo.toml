[package]
name = "karat"
version = "0.4.0"
edition = "2021"
description = "A quiet, lightweight, community-first IDE developed by XySpace"
repository = "https://github.com/xykalnotkel/karat-IDE"
homepage = "https://github.com/xykalnotkel/karat-IDE"
license = "MIT"
authors = ["XySpace and Karat contributors"]

[lib]
name = "karat"
crate-type = ["cdylib", "rlib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "karat"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Desktop/web-only: the Axum server and native PTY are not built for phones.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
futures-util = "0.3"
portable-pty = "0.9"

# For C ABI, no extra deps needed, but ensure stable ABI helpers
[features]
default = []
dll = []
