<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Karat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8622c'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='19' font-weight='bold' text-anchor='middle' fill='white'%3EK%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header id="titlebar">
    <div class="tb-left">
      <span class="tb-logo" title="Karat">
        <svg width="18" height="18" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#e8622c"/><text x="16" y="23" font-family="monospace" font-size="19" font-weight="bold" text-anchor="middle" fill="white">K</text></svg>
      </span>
      <nav class="tb-menus" id="menus"></nav>
    </div>
    <div class="tb-center">
      <button id="quickopen-btn" title="Quick open (Ctrl+P)">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4"/><path d="M10 10l4 4"/></svg>
        <span>karat — search files or commands…</span>
      </button>
    </div>
    <div class="tb-right">
      <button id="theme-btn" class="icon-btn" title="Toggle theme"></button>
    </div>
  </header>

  <div id="workbench">
    <nav id="activitybar"></nav>
    <aside id="sidebar">
      <section class="sideview" id="view-explorer"></section>
      <section class="sideview" id="view-search" hidden></section>
      <section class="sideview" id="view-git" hidden></section>
    </aside>
    <main id="editor-group">
      <div id="tabsbar"><div id="tabs" role="tablist"></div></div>
      <div id="editor-wrap">
        <div id="editor"></div>
        <div id="welcome" hidden>
          <div class="w-box">
            <svg width="64" height="64" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#e8622c"/><text x="16" y="23" font-family="monospace" font-size="19" font-weight="bold" text-anchor="middle" fill="white">K</text></svg>
            <h1>Karat</h1>
            <p class="w-sub">A lightweight IDE crafted with Rust</p>
            <div class="w-actions">
              <button id="w-new" class="btn primary">New File</button>
              <button id="w-palette" class="btn">Command Palette</button>
              <button id="w-open" class="btn">Quick Open</button>
            </div>
            <div class="w-keys">
              <div><kbd>Ctrl+S</kbd><span>Save</span></div>
              <div><kbd>Ctrl+P</kbd><span>Quick open</span></div>
              <div><kbd>Ctrl+Shift+P</kbd><span>Commands</span></div>
              <div><kbd>Ctrl+`</kbd><span>Terminal</span></div>
              <div><kbd>Ctrl+B</kbd><span>Sidebar</span></div>
              <div><kbd>Ctrl+Shift+F</kbd><span>Search</span></div>
            </div>
          </div>
        </div>
      </div>
      <div id="panel">
        <div id="panel-header">
          <div class="panel-tabs"><span class="panel-tab active">TERMINAL</span></div>
          <div class="panel-actions">
            <button id="term-new" class="icon-btn" title="New terminal"></button>
            <button id="term-clear" class="icon-btn" title="Clear terminal"></button>
            <button id="panel-hide" class="icon-btn" title="Hide panel"></button>
          </div>
        </div>
        <div id="panel-body"><div id="terminal"></div></div>
      </div>
    </main>
  </div>

  <footer id="statusbar"></footer>

  <div id="palette" hidden>
    <div id="palette-box">
      <input id="palette-input" placeholder="Type a command or search files…" spellcheck="false" autocomplete="off" />
      <ul id="palette-list"></ul>
    </div>
  </div>
  <div id="menu-pop" hidden></div>
  <div id="modal" hidden><div id="modal-box"></div></div>
  <div id="toasts"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
