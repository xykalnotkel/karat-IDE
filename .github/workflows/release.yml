name: Release DLL + Tauri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: false
        default: "v0.4.0-manual"

jobs:
  build-dll-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build x64 DLL
        run: cargo build --release --lib
      - name: Build x86 DLL
        run: cargo build --release --lib --target i686-pc-windows-msvc
      - name: Pack
        shell: pwsh
        run: |
          mkdir release-dll
          Copy-Item target/release/karat.dll release-dll/
          Copy-Item target/release/karat.lib release-dll/ -ErrorAction SilentlyContinue
          Copy-Item target/i686-pc-windows-msvc/release/karat.dll release-dll/karat_x86.dll
          Copy-Item karat.h release-dll/
          Compress-Archive -Path release-dll/* -DestinationPath karat-dll-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dll-windows
          path: karat-dll-windows.zip

  build-cross:
    strategy:
      matrix:
        platform: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build lib
        run: cargo build --release --lib
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: karat-lib-${{ matrix.platform }}
          path: |
            target/release/libkarat.*
            target/release/*.so
            target/release/*.dylib
          if-no-files-found: warn

  github-release:
    needs: [build-dll-windows, build-cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure
        run: ls -R artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/libkarat.*
            artifacts/**/*.so
            artifacts/**/*.dylib
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
