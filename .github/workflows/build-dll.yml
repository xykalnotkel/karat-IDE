name: Build DLL / CDylib

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows-dll:
    name: Windows DLL (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build Karat core DLL
        run: cargo build --release --lib
      - name: Build desktop DLL
        run: cargo build --release -p karat-desktop --lib
        continue-on-error: true
      - name: List artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse target/release/*.dll,target/release/*.lib -ErrorAction SilentlyContinue | Format-Table
      - name: Prepare DLL package
        shell: pwsh
        run: |
          mkdir dist-dll
          Copy-Item target/release/karat.dll dist-dll/ -ErrorAction SilentlyContinue
          Copy-Item target/release/karat.lib dist-dll/ -ErrorAction SilentlyContinue
          Copy-Item karat.h dist-dll/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist-dll/* -DestinationPath karat-windows-x64-dll.zip
      - name: Upload Windows DLL artifact
        uses: actions/upload-artifact@v7
        with:
          name: karat-windows-x64-dll
          path: |
            dist-dll/
            karat-windows-x64-dll.zip
          retention-days: 30

  build-windows-dll-x86:
    name: Windows DLL (x86_32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build DLL x86
        run: cargo build --release --lib --target i686-pc-windows-msvc
      - name: Prepare
        shell: pwsh
        run: |
          mkdir dist-dll-x86
          Copy-Item target/i686-pc-windows-msvc/release/karat.dll dist-dll-x86/karat_x86.dll
          Compress-Archive -Path dist-dll-x86/* -DestinationPath karat-windows-x86-dll.zip
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: karat-windows-x86-dll
          path: karat-windows-x86-dll.zip

  build-linux-so:
    name: Linux SO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build SO
        run: cargo build --release --lib
      - name: List
        run: ls -lh target/release/*.so || ls -lh target/release/libkarat.*
      - name: Upload SO
        uses: actions/upload-artifact@v7
        with:
          name: karat-linux-x64-so
          path: |
            target/release/libkarat.so
            target/release/libkarat.a
          if-no-files-found: warn

  build-macos-dylib:
    name: macOS dylib
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dylib
        run: cargo build --release --lib
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: karat-macos-dylib
          path: |
            target/release/libkarat.dylib
            target/release/libkarat.a
          if-no-files-found: warn
