name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust + frontend quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: npm audit --audit-level=high
      - run: npm audit --prefix frontend --audit-level=high
      - run: npm run web:build

  web-smoke:
    name: Web server smoke test
    runs-on: ubuntu-22.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix frontend
      - run: npm run web:build
      - run: cargo build --release --bin karat
      - name: Start and verify local web mode
        shell: bash
        run: |
          target/release/karat >karat.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health | grep -q '^ok$'; then
              exit 0
            fi
            sleep 1
          done
          cat karat.log
          exit 1

  desktop:
    name: Desktop bundle (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm ci --prefix frontend
      - name: Test Tauri integration commands
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Import unofficial Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.KARAT_WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.KARAT_WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "karat-unofficial.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "TAURI_SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build signed Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $env:TAURI_SIGNING_THUMBPRINT; digestAlgorithm = "sha256" } } } | ConvertTo-Json -Depth 5
          $config | Out-File -Encoding utf8 "$env:RUNNER_TEMP\tauri-signing.json"
          npm run tauri:build -- --config "$env:RUNNER_TEMP\tauri-signing.json"
      - name: Build Linux bundles
        if: runner.os == 'Linux'
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: karat-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  android:
    name: Android signed APK/AAB (arm32 + arm64)
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm ci --prefix frontend
      - name: Restore Android release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KARAT_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/karat-release.p12"
      - name: Build signed Android 32/64-bit APK and AAB
        env:
          KARAT_ANDROID_KEYSTORE: ${{ runner.temp }}/karat-release.p12
          KARAT_ANDROID_STORE_PASSWORD: ${{ secrets.KARAT_ANDROID_STORE_PASSWORD }}
          KARAT_ANDROID_KEY_ALIAS: ${{ secrets.KARAT_ANDROID_KEY_ALIAS }}
          KARAT_ANDROID_KEY_PASSWORD: ${{ secrets.KARAT_ANDROID_KEY_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export ANDROID_NDK_HOME="$NDK_HOME"
          npx tauri android build --ci --target aarch64 armv7 --apk --aab
      - uses: actions/upload-artifact@v4
        with:
          name: karat-android-signed-arm32-arm64
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
