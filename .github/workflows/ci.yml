name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            karat/package-lock.json
            karat/frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rust fmt
        working-directory: ./karat
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: ./karat
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: ./karat
        run: cargo test --lib

      - name: Install frontend deps
        working-directory: ./karat
        run: npm run setup

      - name: Build frontend
        working-directory: ./karat/frontend
        run: npm run build

      - name: Build backend (web mode)
        working-directory: ./karat
        run: cargo build

  build-dll-smoke:
    name: Smoke build DLL (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build cdylib
        working-directory: ./karat
        run: cargo build --release --lib && ls -lh target/release/libkarat.*
