name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rust fmt
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Cargo test
        run: cargo test --lib
        continue-on-error: true

      - name: Install frontend deps
        run: npm run setup
        continue-on-error: true

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        continue-on-error: true

      - name: Build backend (web mode)
        run: cargo build
        continue-on-error: true

  build-dll-smoke:
    name: Smoke build DLL (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build cdylib
        run: cargo build --release --lib && ls -lh target/release/libkarat.*
